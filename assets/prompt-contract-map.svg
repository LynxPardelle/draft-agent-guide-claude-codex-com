<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de contrato de prompt</title>
  <desc id="desc">Diagrama de ocho piezas para construir un prompt operativo: rol, tarea, contexto, datos, restricciones, salida, criterio y duda.</desc>
  <rect width="1200" height="720" rx="34" fill="#fff8ef"/>
  <rect x="48" y="44" width="1104" height="632" rx="28" fill="#ffffff" stroke="#111820" stroke-width="4"/>
  <text x="86" y="116" fill="#111820" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="900">Prompt operativo</text>
  <text x="88" y="162" fill="#4a5964" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Convierte una intención vaga en un contrato de salida verificable.</text>

  <g font-family="Inter, Arial, sans-serif" font-weight="900" font-size="28" fill="#111820">
    <rect x="86" y="228" width="234" height="118" rx="20" fill="#eaf8ff" stroke="#9ec9dc" stroke-width="2"/>
    <text x="116" y="286">Rol</text>
    <text x="116" y="322" font-size="19" font-weight="700" fill="#4a5964">responsabilidad</text>

    <rect x="366" y="228" width="234" height="118" rx="20" fill="#dff7e8" stroke="#9fd7b8" stroke-width="2"/>
    <text x="396" y="286">Tarea</text>
    <text x="396" y="322" font-size="19" font-weight="700" fill="#4a5964">resultado observable</text>

    <rect x="646" y="228" width="234" height="118" rx="20" fill="#fff4e6" stroke="#e0bd8c" stroke-width="2"/>
    <text x="676" y="286">Contexto</text>
    <text x="676" y="322" font-size="19" font-weight="700" fill="#4a5964">fuentes y reglas</text>

    <rect x="926" y="228" width="188" height="118" rx="20" fill="#f4f0ff" stroke="#c0b0df" stroke-width="2"/>
    <text x="956" y="286">Datos</text>
    <text x="956" y="322" font-size="19" font-weight="700" fill="#4a5964">entrada delimitada</text>

    <rect x="86" y="426" width="234" height="118" rx="20" fill="#ffecef" stroke="#e8a9b2" stroke-width="2"/>
    <text x="116" y="484">Restricciones</text>
    <text x="116" y="520" font-size="19" font-weight="700" fill="#4a5964">límites y seguridad</text>

    <rect x="366" y="426" width="234" height="118" rx="20" fill="#eaf8ff" stroke="#9ec9dc" stroke-width="2"/>
    <text x="396" y="484">Salida</text>
    <text x="396" y="520" font-size="19" font-weight="700" fill="#4a5964">formato revisable</text>

    <rect x="646" y="426" width="234" height="118" rx="20" fill="#dff7e8" stroke="#9fd7b8" stroke-width="2"/>
    <text x="676" y="484">Criterio</text>
    <text x="676" y="520" font-size="19" font-weight="700" fill="#4a5964">cómo validar</text>

    <rect x="926" y="426" width="188" height="118" rx="20" fill="#111820" stroke="#111820" stroke-width="2"/>
    <text x="956" y="484" fill="#ffffff">Duda</text>
    <text x="956" y="520" font-size="19" font-weight="700" fill="#c9d8e3">pregunta o frena</text>
  </g>

  <g fill="none" stroke="#111820" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M320 287h46"/>
    <path d="M600 287h46"/>
    <path d="M880 287h46"/>
    <path d="M203 346v80"/>
    <path d="M483 346v80"/>
    <path d="M763 346v80"/>
    <path d="M1020 346v80"/>
  </g>
  <g fill="#111820">
    <path d="M358 274l18 13-18 13z"/>
    <path d="M638 274l18 13-18 13z"/>
    <path d="M918 274l18 13-18 13z"/>
    <path d="M190 418l13 18 13-18z"/>
    <path d="M470 418l13 18 13-18z"/>
    <path d="M750 418l13 18 13-18z"/>
    <path d="M1007 418l13 18 13-18z"/>
  </g>

  <rect x="86" y="586" width="1028" height="58" rx="16" fill="#111820"/>
  <text x="116" y="620" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Regla práctica: valida la salida antes de confiar.</text>
</svg>
