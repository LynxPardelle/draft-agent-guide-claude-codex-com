<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Router de skills recomendados</title>
  <desc id="desc">Casos de uso que seleccionan skill principal, soporte y evidencia.</desc>
  <rect width="1200" height="620" rx="34" fill="#f7f4ec"/>
  <rect x="72" y="58" width="1056" height="504" rx="30" fill="#fff" stroke="#101820" stroke-width="5"/>
  <text x="112" y="122" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#102a43">Router de skills</text>
  <text x="112" y="158" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#52616b">El caso define el stack y la evidencia</text>
  <g font-family="Arial, sans-serif" fill="#102a43" font-weight="800">
