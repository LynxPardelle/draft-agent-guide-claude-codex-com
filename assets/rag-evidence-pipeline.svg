<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline RAG con evidencia</title>
  <desc id="desc">Diagrama de una pregunta que pasa por corpus, recuperacion, filtrado, respuesta con citas y huecos declarados.</desc>
  <rect width="1200" height="720" rx="36" fill="#f6f2ea"/>
  <rect x="58" y="58" width="1084" height="604" rx="28" fill="none" stroke="#101820" stroke-width="5"/>
  <text x="96" y="126" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="#102a43">RAG: evidencia antes de generar</text>
  <text x="98" y="166" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#496274">Recupera, filtra, cita y declara lo que no se sabe.</text>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#102a43"/>
    </marker>
    <style>
      .box-title{font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:800;fill:#102a43}
      .box-text{font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:700;fill:#415466}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:700;fill:#102a43}
    </style>
  </defs>

  <g>
    <rect x="94" y="250" width="184" height="112" rx="18" fill="#dff2ff" stroke="#8ec5e5" stroke-width="3"/>
    <text class="box-title" x="124" y="300">Pregunta</text>
    <text class="box-text" x="124" y="332">alcance claro</text>
  </g>
  <g>
    <rect x="352" y="250" width="184" height="112" rx="18" fill="#d9f7e8" stroke="#8ccfb1" stroke-width="3"/>
    <text class="box-title" x="382" y="300">Corpus</text>
    <text class="box-text" x="382" y="332">fuentes permitidas</text>
  </g>
  <g>
    <rect x="610" y="250" width="196" height="112" rx="18" fill="#dff2ff" stroke="#8ec5e5" stroke-width="3"/>
    <text class="box-title" x="640" y="300">Retrieval</text>
    <text class="box-text" x="640" y="332">candidatos</text>
  </g>
  <g>
    <rect x="882" y="250" width="194" height="112" rx="18" fill="#fff0dc" stroke="#e6b16e" stroke-width="3"/>
    <text class="box-title" x="912" y="300">Filtrado</text>
    <text class="box-text" x="912" y="332">relevancia</text>
  </g>

  <path d="M278 306 H344" stroke="#102a43" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M536 306 H602" stroke="#102a43" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M806 306 H874" stroke="#102a43" stroke-width="5" marker-end="url(#arrow)"/>

  <path d="M980 362 V430" stroke="#102a43" stroke-width="5" marker-end="url(#arrow)"/>
  <g>
    <rect x="706" y="446" width="370" height="112" rx="18" fill="#102a43"/>
    <text x="736" y="496" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#dff2ff">Respuesta con citas</text>
    <text x="736" y="530" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#f6f2ea">afirma solo lo que sostiene la fuente</text>
  </g>

  <g>
    <rect x="94" y="446" width="246" height="112" rx="18" fill="#fff" stroke="#ccd7df" stroke-width="3"/>
    <text class="box-title" x="124" y="494">Huecos</text>
    <text class="box-text" x="124" y="528">evidencia insuficiente</text>
  </g>
  <g>
    <rect x="386" y="446" width="246" height="112" rx="18" fill="#fff" stroke="#ccd7df" stroke-width="3"/>
    <text class="box-title" x="416" y="494">Confianza</text>
    <text class="box-text" x="416" y="528">alta, media o baja</text>
  </g>
  <path d="M706 502 H640" stroke="#102a43" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M386 502 H348" stroke="#102a43" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="94" y="596" width="958" height="42" rx="13" fill="#eaf4f8" stroke="#b8d8e6" stroke-width="2"/>
  <text class="small" x="122" y="623">Regla practica: si no puedes citar el fragmento que sostiene una afirmacion, no la presentes como evidencia.</text>
</svg>
