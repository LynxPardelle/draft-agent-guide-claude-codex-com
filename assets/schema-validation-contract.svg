<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Contrato de tool schema</title>
  <desc id="desc">Flujo de herramienta con entrada, validacion, permisos, ejecucion y salida auditable.</desc>
  <rect width="1200" height="620" rx="34" fill="#eef8ff"/>
  <rect x="70" y="58" width="1060" height="504" rx="30" fill="#ffffff" stroke="#101820" stroke-width="5"/>
  <text x="110" y="122" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#102a43">Tool schema como contrato</text>
  <text x="110" y="158" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#52616b">Entrada validable, permisos minimos y resultado auditable</text>
  <g font-family="Arial, sans-serif" font-weight="800" fill="#102a43">
    <rect x="110" y="230" width="180" height="94" rx="18" fill="#dff3ff" stroke="#7bbde0" stroke-width="3"/>
    <text x="142" y="274" font-size="27">Entrada</text>
    <text x="142" y="302" font-size="17">campos claros</text>
    <rect x="376" y="230" width="180" height="94" rx="18" fill="#ddf7e9" stroke="#82c79d" stroke-width="3"/>
    <text x="408" y="274" font-size="27">Valida</text>
    <text x="408" y="302" font-size="17">tipos y limites</text>
    <rect x="642" y="230" width="180" height="94" rx="18" fill="#fff1dc" stroke="#dda965" stroke-width="3"/>
    <text x="674" y="274" font-size="27">Permisos</text>
    <text x="674" y="302" font-size="17">alcance minimo</text>
    <rect x="908" y="230" width="180" height="94" rx="18" fill="#ffe4ea" stroke="#d68a9a" stroke-width="3"/>
    <text x="940" y="274" font-size="27">Salida</text>
    <text x="940" y="302" font-size="17">evidencia</text>
  </g>
  <g stroke="#102a43" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M290 277h86"/>
    <path d="M556 277h86"/>
    <path d="M822 277h86"/>
    <path d="M356 259l20 18-20 18"/>
    <path d="M622 259l20 18-20 18"/>
    <path d="M888 259l20 18-20 18"/>
  </g>
  <rect x="206" y="412" width="788" height="72" rx="18" fill="#111820"/>
  <text x="242" y="456" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#ffffff">Gate humano para acciones irreversibles o publicas</text>
</svg>
