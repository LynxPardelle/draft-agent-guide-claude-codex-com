<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Browser QA observatory</title>
  <desc id="desc">Diagram of browser QA signals: route, action, console, network, viewport and evidence.</desc>
  <rect width="1200" height="720" rx="28" fill="#eef8fb"/>
  <rect x="70" y="70" width="1060" height="560" rx="26" fill="#ffffff" stroke="#102638" stroke-width="6"/>
  <text x="110" y="135" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#12324a">Browser QA</text>
  <text x="110" y="178" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#426276">Observe UI, action and runtime health</text>
  <rect x="110" y="230" width="380" height="250" rx="18" fill="#dff3ff" stroke="#7bb8d5" stroke-width="3"/>
  <rect x="135" y="260" width="330" height="42" rx="12" fill="#102638"/>
  <text x="155" y="288" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Route loaded</text>
  <rect x="135" y="325" width="145" height="76" rx="14" fill="#ffffff" stroke="#b8d7e8"/>
  <text x="160" y="370" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#12324a">H1</text>
  <rect x="300" y="325" width="145" height="76" rx="14" fill="#ffffff" stroke="#b8d7e8"/>
  <text x="327" y="370" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#12324a">Links</text>
  <rect x="135" y="420" width="310" height="34" rx="10" fill="#c8eadf"/>
  <text x="158" y="443" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#12324a">No empty state</text>
  <g fill="none" stroke="#102638" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M510 355h105"/>
    <path d="M600 335l25 20-25 20"/>
  </g>
  <rect x="635" y="215" width="340" height="315" rx="24" fill="#12324a"/>
  <text x="675" y="270" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#ffffff">Signals</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="800">
    <rect x="675" y="310" width="240" height="46" rx="12" fill="#dff3ff"/>
    <text x="700" y="340" fill="#12324a">Console</text>
    <rect x="675" y="372" width="240" height="46" rx="12" fill="#d7f3e4"/>
    <text x="700" y="402" fill="#12324a">Network</text>
    <rect x="675" y="434" width="240" height="46" rx="12" fill="#fff0d8"/>
    <text x="700" y="464" fill="#12324a">Viewport</text>
  </g>
  <rect x="235" y="545" width="730" height="58" rx="16" fill="#fff0d8" stroke="#e0b56a" stroke-width="3"/>
  <text x="270" y="582" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#12324a">Close with route, action, result and risk</text>
</svg>
