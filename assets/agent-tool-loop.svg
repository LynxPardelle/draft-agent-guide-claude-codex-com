<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Loop agente tool evaluacion humano</title>
  <desc id="desc">Diagrama del ciclo contexto, agente, tool, resultado, evaluacion y revision humana.</desc>
  <rect width="1200" height="720" rx="36" fill="#f7f5ee"/>
  <rect x="42" y="42" width="1116" height="636" rx="28" fill="#ffffff" stroke="#111820" stroke-width="3"/>
  <text x="80" y="112" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#111820">Loop operativo de un agente</text>
  <text x="80" y="154" font-family="Inter, Arial, sans-serif" font-size="20" fill="#44515c">Cada paso debe dejar evidencia antes de avanzar al siguiente.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#111820">
    <rect x="86" y="244" width="166" height="92" rx="18" fill="#eaf8ff" stroke="#111820" stroke-width="2"/>
    <text x="122" y="282">Contexto</text>
    <text x="116" y="311" font-size="15" font-weight="500">instrucciones y datos</text>
    <rect x="332" y="244" width="166" height="92" rx="18" fill="#ffffff" stroke="#111820" stroke-width="2"/>
    <text x="384" y="282">Agente</text>
    <text x="368" y="311" font-size="15" font-weight="500">decide el paso</text>
    <rect x="578" y="244" width="166" height="92" rx="18" fill="#e9f7e8" stroke="#111820" stroke-width="2"/>
    <text x="633" y="282">Tool</text>
    <text x="603" y="311" font-size="15" font-weight="500">accion verificable</text>
    <rect x="824" y="244" width="166" height="92" rx="18" fill="#fff4e6" stroke="#111820" stroke-width="2"/>
    <text x="858" y="282">Resultado</text>
    <text x="858" y="311" font-size="15" font-weight="500">salida concreta</text>
  </g>
  <g stroke="#111820" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M252 290H324"/><path d="M312 278l16 12-16 12"/>
    <path d="M498 290H570"/><path d="M558 278l16 12-16 12"/>
    <path d="M744 290H816"/><path d="M804 278l16 12-16 12"/>
    <path d="M907 338v74H295v74"/><path d="M283 474l12 16 12-16"/>
  </g>
  <rect x="210" y="490" width="230" height="100" rx="20" fill="#111820"/>
  <text x="250" y="532" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#ffffff">Evaluacion</text>
  <text x="250" y="562" font-family="Inter, Arial, sans-serif" font-size="16" fill="#d9e6ed">criterio observable</text>
  <rect x="520" y="490" width="250" height="100" rx="20" fill="#ffffff" stroke="#111820" stroke-width="2"/>
  <text x="562" y="532" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#111820">Humano</text>
  <text x="562" y="562" font-family="Inter, Arial, sans-serif" font-size="16" fill="#44515c">aprueba, corrige o frena</text>
  <path d="M440 540H512" stroke="#111820" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M500 528l16 12-16 12" stroke="#111820" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
