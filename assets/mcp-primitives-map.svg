<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de primitives MCP</title>
  <desc id="desc">Resources, tools y prompts conectados a roots, inspector y cliente.</desc>
  <rect width="1200" height="720" rx="36" fill="#f6f2ea"/>
  <rect x="58" y="58" width="1084" height="604" rx="28" fill="none" stroke="#101820" stroke-width="5"/>
  <text x="96" y="126" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="#102a43">MCP: contexto y acciones con contrato</text>
  <text x="98" y="166" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#496274">Elige primitive, limita alcance y prueba antes de integrar.</text>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M 0 0 L 14 7 L 0 14 z" fill="#102a43"/></marker>
    <style>.t{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:800;fill:#102a43}.s{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#435768}</style>
  </defs>
  <rect x="112" y="242" width="220" height="120" rx="18" fill="#dff2ff" stroke="#8ec5e5" stroke-width="3"/>
  <text class="t" x="142" y="292">Resources</text><text class="s" x="142" y="326">datos que se leen</text>
  <rect x="410" y="242" width="220" height="120" rx="18" fill="#d9f7e8" stroke="#8ccfb1" stroke-width="3"/>
  <text class="t" x="450" y="292">Tools</text><text class="s" x="450" y="326">acciones con schema</text>
  <rect x="708" y="242" width="220" height="120" rx="18" fill="#fff0dc" stroke="#e6b16e" stroke-width="3"/>
  <text class="t" x="746" y="292">Prompts</text><text class="s" x="746" y="326">workflows reutilizables</text>
  <path d="M332 302 H402" stroke="#102a43" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M630 302 H700" stroke="#102a43" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="112" y="454" width="270" height="102" rx="18" fill="#fff" stroke="#ccd7df" stroke-width="3"/>
  <text class="t" x="142" y="494">Roots</text><text class="s" x="142" y="528">frontera de acceso</text>
  <rect x="462" y="454" width="270" height="102" rx="18" fill="#102a43"/>
  <text x="492" y="494" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#dff2ff">Inspector</text>
  <text x="492" y="528" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#f6f2ea">prueba discovery y errores</text>
  <rect x="812" y="454" width="270" height="102" rx="18" fill="#fff" stroke="#ccd7df" stroke-width="3"/>
  <text class="t" x="842" y="494">Cliente</text><text class="s" x="842" y="528">elige con permisos</text>
  <path d="M247 362 V444" stroke="#102a43" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M520 362 V444" stroke="#102a43" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M818 362 V444" stroke="#102a43" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="112" y="596" width="970" height="42" rx="13" fill="#eaf4f8" stroke="#b8d8e6" stroke-width="2"/>
  <text x="140" y="623" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#102a43">Regla práctica: si no puedes explicar permisos y salida, el primitive todavía no está listo.</text>
</svg>
