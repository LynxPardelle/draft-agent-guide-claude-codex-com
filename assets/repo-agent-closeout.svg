<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Cierre de agente de código</title>
  <desc id="desc">Flujo para trabajar en un repositorio con instrucciones, diff, validacion y evidencia.</desc>
  <rect width="1200" height="720" rx="36" fill="#f6f2ea"/>
  <rect x="58" y="58" width="1084" height="604" rx="28" fill="none" stroke="#101820" stroke-width="5"/>
  <text x="96" y="126" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" fill="#102a43">Agente de código: cierre verificable</text>
  <text x="98" y="166" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#496274">Lee reglas, edita poco, valida y reporta exactamente.</text>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14z" fill="#102a43"/></marker></defs>
  <g font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#102a43" font-size="25">
    <rect x="98" y="260" width="180" height="104" rx="18" fill="#dff2ff" stroke="#8ec5e5" stroke-width="3"/><text x="126" y="320">Reglas</text>
    <rect x="340" y="260" width="180" height="104" rx="18" fill="#d9f7e8" stroke="#8ccfb1" stroke-width="3"/><text x="368" y="320">Inspección</text>
    <rect x="582" y="260" width="180" height="104" rx="18" fill="#fff0dc" stroke="#e6b16e" stroke-width="3"/><text x="626" y="320">Diff</text>
    <rect x="824" y="260" width="180" height="104" rx="18" fill="#dff2ff" stroke="#8ec5e5" stroke-width="3"/><text x="860" y="320">Build QA</text>
  </g>
  <path d="M278 312 H332" stroke="#102a43" stroke-width="5" marker-end="url(#arrow)"/><path d="M520 312 H574" stroke="#102a43" stroke-width="5" marker-end="url(#arrow)"/><path d="M762 312 H816" stroke="#102a43" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="196" y="466" width="320" height="112" rx="18" fill="#fff" stroke="#ccd7df" stroke-width="3"/>
  <text x="226" y="510" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#102a43">No revertir cambios ajenos</text>
  <text x="226" y="544" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#435768">trabaja con el estado actual</text>
  <rect x="596" y="466" width="320" height="112" rx="18" fill="#102a43"/>
  <text x="626" y="510" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#dff2ff">Reporte verificable</text>
  <text x="626" y="544" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#f6f2ea">comandos, fallos y screenshots</text>
  <path d="M914 364 V456 H760" stroke="#102a43" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
</svg>
