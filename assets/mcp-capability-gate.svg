<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">MCP con permisos por capability</title>
  <desc id="desc">Diagrama de resources, tools, prompts y gates de permiso.</desc>
  <rect width="1200" height="620" rx="34" fill="#eef8ff"/>
  <rect x="70" y="58" width="1060" height="504" rx="30" fill="#fff" stroke="#101820" stroke-width="5"/>
  <text x="110" y="122" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#102a43">MCP avanzado</text>
  <text x="110" y="158" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#52616b">Publica capacidades con permiso y evidencia</text>
  <g font-family="Arial, sans-serif" fill="#102a43" font-weight="800">
    <rect x="112" y="226" width="230" height="116" rx="20" fill="#dff3ff" stroke="#7bbde0" stroke-width="3"/>
    <text x="140" y="274" font-size="28">Resources</text>
    <text x="140" y="306" font-size="17">contexto legible</text>
    <rect x="412" y="226" width="230" height="116" rx="20" fill="#ddf7e9" stroke="#82c79d" stroke-width="3"/>
    <text x="440" y="274" font-size="28">Tools</text>
    <text x="440" y="306" font-size="17">accion validable</text>
    <rect x="712" y="226" width="230" height="116" rx="20" fill="#fff1dc" stroke="#dda965" stroke-width="3"/>
    <text x="740" y="274" font-size="28">Prompts</text>
    <text x="740" y="306" font-size="17">plantilla reusable</text>
    <rect x="412" y="420" width="230" height="86" rx="18" fill="#111820"/>
    <text x="446" y="454" font-size="25" fill="#fff">Gate</text>
    <text x="446" y="482" font-size="17" fill="#d5edf8">permiso humano</text>
  </g>
  <g stroke="#102a43" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M342 284h70"/>
    <path d="M642 284h70"/>
    <path d="M527 342v78"/>
    <path d="M392 266l20 18-20 18"/>
    <path d="M692 266l20 18-20 18"/>
    <path d="M507 400l20 20 20-20"/>
  </g>
  <rect x="720" y="416" width="278" height="90" rx="18" fill="#f7f4ec" stroke="#d6cdbd" stroke-width="3"/>
  <text x="746" y="452" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#102a43">Regla</text>
  <text x="746" y="480" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#52616b">Lectura y accion</text>
  <text x="746" y="504" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#52616b">se habilitan aparte.</text>
</svg>
