<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Tablero de laboratorios</title>
  <desc id="desc">Laboratorios organizados por escenario, entregable, rubrica y evidencia.</desc>
  <rect width="1200" height="720" rx="36" fill="#f6f2ea"/>
  <rect x="58" y="58" width="1084" height="604" rx="28" fill="none" stroke="#101820" stroke-width="5"/>
  <text x="96" y="126" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="#102a43">Laboratorio: decisión con evidencia</text>
  <text x="98" y="166" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#496274">Escenario, restricciones, entregable y rúbrica.</text>
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="116" y="242" width="260" height="128" rx="18" fill="#dff2ff" stroke="#8ec5e5" stroke-width="3"/><text x="146" y="292" font-size="28" font-weight="800" fill="#102a43">Escenario</text><text x="146" y="328" font-size="18" font-weight="700" fill="#435768">trabajo realista</text>
    <rect x="430" y="242" width="260" height="128" rx="18" fill="#d9f7e8" stroke="#8ccfb1" stroke-width="3"/><text x="460" y="292" font-size="28" font-weight="800" fill="#102a43">Entregable</text><text x="460" y="328" font-size="18" font-weight="700" fill="#435768">artefacto revisable</text>
    <rect x="744" y="242" width="260" height="128" rx="18" fill="#fff0dc" stroke="#e6b16e" stroke-width="3"/><text x="774" y="292" font-size="28" font-weight="800" fill="#102a43">Rúbrica</text><text x="774" y="328" font-size="18" font-weight="700" fill="#435768">PASS / FAIL</text>
    <rect x="274" y="462" width="300" height="112" rx="18" fill="#fff" stroke="#ccd7df" stroke-width="3"/><text x="304" y="506" font-size="26" font-weight="800" fill="#102a43">Evidencia</text><text x="304" y="540" font-size="18" font-weight="700" fill="#435768">cita, diff, test o screenshot</text>
    <rect x="654" y="462" width="300" height="112" rx="18" fill="#102a43"/><text x="684" y="506" font-size="26" font-weight="800" fill="#dff2ff">Feedback</text><text x="684" y="540" font-size="18" font-weight="700" fill="#f6f2ea">repetir con más dificultad</text>
  </g>
</svg>
