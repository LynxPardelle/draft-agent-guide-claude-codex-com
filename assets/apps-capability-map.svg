<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de capacidades de apps y complementos</title>
  <desc id="desc">Categorias de browser, repo, diseno, documentos, deploy y seguridad con permisos.</desc>
  <rect width="1200" height="620" rx="34" fill="#eef8ff"/>
  <rect x="72" y="58" width="1056" height="504" rx="30" fill="#fff" stroke="#101820" stroke-width="5"/>
  <text x="112" y="122" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#102a43">Apps y complementos</text>
  <text x="112" y="158" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#52616b">Capacidad minima, permiso claro, evidencia final</text>
  <g font-family="Arial, sans-serif" fill="#102a43" font-weight="800">
    <rect x="112" y="232" width="170" height="82" rx="16" fill="#dff3ff" stroke="#7bbde0" stroke-width="3"/>
    <text x="140" y="282" font-size="23">Browser</text>
    <rect x="326" y="232" width="170" height="82" rx="16" fill="#ddf7e9" stroke="#82c79d" stroke-width="3"/>
    <text x="354" y="282" font-size="23">Repo</text>
    <rect x="540" y="232" width="170" height="82" rx="16" fill="#fff1dc" stroke="#dda965" stroke-width="3"/>
    <text x="568" y="282" font-size="23">Diseno</text>
    <rect x="754" y="232" width="170" height="82" rx="16" fill="#ffe4ea" stroke="#d68a9a" stroke-width="3"/>
    <text x="782" y="282" font-size="23">Docs</text>
    <rect x="326" y="392" width="170" height="82" rx="16" fill="#f7f4ec" stroke="#d6cdbd" stroke-width="3"/>
    <text x="354" y="442" font-size="23">Deploy</text>
    <rect x="540" y="392" width="170" height="82" rx="16" fill="#111820"/>
    <text x="568" y="442" font-size="23" fill="#fff">Seguridad</text>
  </g>
  <text x="760" y="430" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#102a43">Regla</text>
  <text x="760" y="462" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#52616b">Conectar menos,</text>
  <text x="760" y="488" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#52616b">verificar mas.</text>
</svg>
